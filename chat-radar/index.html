<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대화 레이더</title>
<style>
:root{--bg:#f2f4f6;--card:#fff;--text:#191f28;--sub:#4e5968;--line:#e5e8eb;--accent:#1b64da}.c-chat-radar{--accent:#1B64DA}.c-follow-check{--accent:#087050}.c-myth-me{--accent:#6944DA}.c-local-flyers{--accent:#A64504}
@media (prefers-color-scheme:dark){:root{--bg:#17171c;--card:#202027;--text:#ececf0;--sub:#a8a8b3;--line:#33333d;--accent:#6aa5ff}.c-chat-radar{--accent:#6AA5FF}.c-follow-check{--accent:#38D9A9}.c-myth-me{--accent:#9274EE}.c-local-flyers{--accent:#F76707}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;word-break:keep-all;overflow-wrap:anywhere}
main{max-width:680px;margin:0 auto;padding:24px 16px 48px}
.card{background:var(--card);border-radius:16px;padding:20px;margin:0 0 12px}
h1{font-size:24px;line-height:1.35;margin:0 0 8px}
h2{font-size:18px;margin:28px 0 8px;padding-top:16px;border-top:1px solid var(--line)}
h2:first-of-type{border-top:0;padding-top:0}
p,li{color:var(--sub)}
ul{padding-left:20px}
a{color:var(--accent)}
.brand{font-size:14px;font-weight:700;color:var(--accent);margin:0 0 4px}
.files a{display:block;padding:12px 0;border-top:1px solid var(--line);font-weight:600}
.files a:first-child{border-top:0}
.small{font-size:14px}
footer{font-size:14px;color:var(--sub);text-align:center;margin-top:24px}
</style>
</head>
<body class="c-chat-radar">
<main>
<div class="card"><p class="brand">토스 미니앱</p><h1>대화 레이더</h1><p>카카오톡에서 직접 내보낸 대화 파일을 휴대폰 안에서만 분석해, 단톡방에서 떠난 사람·조용해진 사람·인원 변화와 1:1 대화 흐름을 보여 줘요.</p><p class="small">파일은 휴대폰 밖으로 나가지 않아요. 서버도 로그인도 없어요.</p></div>
<div class="card files"><a href="privacy/">개인정보처리방침</a><a href="samples/">검수용 샘플 파일</a></div>
<footer>럭키스랩 · <a href="mailto:luckyslab.studio@gmail.com">luckyslab.studio@gmail.com</a></footer>
</main>
</body>
</html>
